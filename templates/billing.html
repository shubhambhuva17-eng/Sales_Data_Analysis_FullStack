{% extends "base.html" %}
{% block title %}Create Bill | SalesPro{% endblock %}
{% block content %}
<div class="page-heading">
    <div>
        <span class="eyebrow">BILLING</span>
        <h1>Create Customer Bill</h1>
    </div>
</div>

<form class="panel" method="post" action="{{ url_for('create_bill') }}">
    <label for="customer">Customer Name</label>
    <input id="customer" name="customer" required placeholder="Enter customer name">

    <div class="section-row">
        <h2>Products</h2>
        <button class="btn secondary" type="button" id="addProduct">+ Add Product</button>
    </div>

    <div id="productRows">
        <div class="product-row">
            <select name="product[]" class="product-select" required>
                <option value="">Select product</option>
                {% for product in products %}
                <option value="{{ product.name }}" data-price="{{ product.price }}">
                    {{ product.name }} — ₹{{ product.price }}
                </option>
                {% endfor %}
            </select>
            <input type="number" name="quantity[]" class="quantity" min="1" value="1" required>
            <input type="text" class="price" placeholder="Price" readonly>
            <button type="button" class="remove-row btn danger">Remove</button>
        </div>
    </div>

    <div class="bill-preview">
        <span>Estimated Total</span>
        <strong id="estimatedTotal">₹0.00</strong>
    </div>

    <button class="btn primary large" type="submit">Generate Bill</button>
</form>

<script src="{{ url_for('static', filename='billing.js') }}"></script>
{% endblock %}
