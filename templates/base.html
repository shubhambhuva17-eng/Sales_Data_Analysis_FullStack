<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sales Data Analysis{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="navbar">
    <a class="brand" href="{{ url_for('index') }}">SalesPro</a>
    <nav>
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('billing') }}">Create Bill</a>
        <a href="{{ url_for('sales') }}">Sales History</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
    </nav>
</header>

<main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>

<footer>Sales Data Analysis & Billing System</footer>
</body>
</html>
